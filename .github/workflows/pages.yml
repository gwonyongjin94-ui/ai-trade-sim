# main에 올리면 테스트 → 빌드 → GitHub Pages 배포. 배포본은 정적 파일뿐이고 API 키를 쓰지 않는다.
name: 지도 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
      - name: 배포본에 키 문자열이 없는지 확인
        run: "! grep -rlE 'sk-ant|ANTHROPIC|x-api-key|/api/llm' dist"
      - name: 리플레이 목록과 계산 스레드가 배포본에 있는지 확인
        run: test -s dist/replays/index.json && ls dist/assets | grep -q '^worker-'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
